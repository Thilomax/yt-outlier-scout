name: Weekly outlier scout

on:
  schedule:
    - cron: "0 17 * * 0"   # Sundays 17:00 UTC (19:00 Oslo summer time)
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:                     # re-run when the script or topics change
    branches: [main]
    paths: ["scout.py", "config.json", ".github/workflows/scout.yml"]

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find outliers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YT_OUTLIER_SCOUT }}
        run: python scout.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for f in outliers.json seen.json creators_cache.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "Outliers $(date -u +%F)"
          git push
